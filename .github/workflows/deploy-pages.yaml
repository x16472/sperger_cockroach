# 工作流程名稱會顯示於 GitHub Actions 與 Pages 部署紀錄。
name: Deploy sperger_cockroach to GitHub Pages

# main 分支更新或手動執行時啟動發布。
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 僅授予讀取程式碼與部署 Pages 所需權限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間僅保留最新一次 Pages 部署。
concurrency:
  group: pages
  cancel-in-progress: true

# 先建置靜態網站，再部署 Pages 成品。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 取出目前儲存庫內容。
      - name: Checkout repository
        uses: actions/checkout@v6
      # 安裝 .NET 10 SDK。
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # 還原 NuGet 套件。
      - name: Restore dependencies
        run: dotnet restore sperger_cockroach.csproj
      # 產生 Release 靜態發布內容。
      - name: Publish Blazor WebAssembly
        run: dotnet publish sperger_cockroach.csproj --configuration Release --no-restore --output publish
      # 依儲存庫名稱修正 base href，並加入 SPA 與 Jekyll 相容檔案。
      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          site_root="publish/wwwroot"
          sed -i "s|<base href=\"/\" />|<base href=\"/${repository_name}/\" />|" "${site_root}/index.html"
          cp "${site_root}/index.html" "${site_root}/404.html"
          touch "${site_root}/.nojekyll"
      # 將靜態網站封裝為 GitHub Pages 成品。
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 將上一個工作產生的成品部署至 GitHub Pages。
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
