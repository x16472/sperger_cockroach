intro:
  kicker: "序章／雨後的蛋白質召喚"
  headline: "泥沼很糟。"
  headlineAccent: "狩獵很優雅。"
  lead: "絕壁環繞的蟲鳴谷剛下過一場雨。孕蟲河喚醒地底的巨型昆蟲，也讓極少數友善小動物離開藏身處。斯柏格決定站在原地，等待獵物自己送上門。"
  quote: "移動會增加污泥附著面積。讓獵物自己送上門，才是兼顧熱量與尊嚴的理性解。"
  quoteBy: "斯柏格．費里尼，變異美國蟑螂／博學的美食家"
  startButton: "進入狩獵獵場"

