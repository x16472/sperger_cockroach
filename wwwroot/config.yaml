lore:
  heading: "斯柏格．費里尼"
  lead: "從隱密實驗室逃出的變異美國蟑螂，以冷靜判斷、生物學知識與對優質蛋白質的品味在蟲鳴谷求生。"
  sections:
    - key: "basic"
      title: "基本資料與性格"
      content: |-
        姓名：斯柏格．費里尼（Sperger Fellini），偏名斯柏，性別為公，種族是美國蟑螂。
        外型與普通蟑螂相近，但體型大上數倍。個性隨遇而安、十分冷靜，具備高 EQ，習慣謹慎思考後再做決定。
    - key: "background"
      title: "背景故事"
      content: |-
        斯柏格原本是隱密實驗室的人道替換實驗對象。實驗使牠獲得意識與自由意志；為追求自由，牠逃離設施並來到蟲鳴谷。
    - key: "gift"
      title: "能力：變異體"
      content: |-
        表層肌膚具有輕皮甲般的防禦，肢體末端的攀爬爪能適應陡坡並支援飛行。
        牠對氣味與流體極度敏感，能以口器辨識物質內部狀態；尖銳牙齒兼具撕裂與咀嚼能力。吞食生物或消耗品時，能最大化吸收其效果。
    - key: "traits"
      title: "知識與專長"
      content: |-
        野性之音使斯柏格能與龍種、野獸及蟲類交流。牠熟悉生物、植物與生態學，也具備烹飪、營養與美食學知識。

