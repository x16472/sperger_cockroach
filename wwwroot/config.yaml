chapters:
  - title: "雨後爛泥與蛋白質的召喚"
    kicker: "MUD CAVITY / 01"
    story: "雨後地底開始躁動。斯柏格伏在冒泡泥穴之間，以最少移動換取最高熱量。"
    quote: "泥巴很討厭，但這些異變甲蟲的蛋白質確實優質。"
  - title: "高難度狩獵的考驗"
    kicker: "PREGNANT RIVER / 02"
    story: "狩獵線轉向河畔。木柴與友善生物混入獵物群，感官判斷比速度更加重要。"
    quote: "盲目啃咬是不智之舉；每個輪廓都值得先行辨認。"
  - title: "暴食領主的割草盛宴"
    kicker: "DEEP SWAMP / 03"
    story: "深處蟲潮湧現。斯柏格在不傷及谷中生態的前提下，完成最後一輪狩獵。"
    quote: "喧囂將退去。今晚的能量上限，就由這一輪決定。"

